apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-app
  namespace: atlas
  labels:
    app: atlas-app
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below capacity during a rollout
  selector:
    matchLabels:
      app: atlas-app
  template:
    metadata:
      labels:
        app: atlas-app
    spec:
      # Spread replicas across nodes so losing one node doesn't take out
      # a disproportionate share of capacity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: atlas-app

      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2;
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: atlas-secrets, key: POSTGRES_USER }

      containers:
        - name: app
          image: sysdesign-atlas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: atlas-config }
            - secretRef: { name: atlas-secrets }

          # Liveness is process-only. If it checked the database, a brief DB
          # outage would restart every pod simultaneously and turn a
          # degradation into a full outage.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness DOES check the database, so a pod that can't reach it
          # is pulled from the Service without being killed.
          # Path is quoted: an unquoted "?" is a YAML complex-key indicator.
          readinessProbe:
            httpGet:
              path: '/api/health?deep=1'
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2

          # requests drive scheduling AND the HPA's utilisation maths.
          resources:
            requests: { cpu: 200m, memory: 320Mi }
            limits: { cpu: '1', memory: 1Gi }

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']

      # Give in-flight requests time to finish before the pod dies.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-app
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app: atlas-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Keeps a quorum of pods serving during voluntary disruptions
# (node drains, cluster upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-app
  namespace: atlas
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: atlas-app
