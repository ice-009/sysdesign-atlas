apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-config
  namespace: atlas
data:
  NODE_ENV: 'production'
  PORT: '3000'
  HOSTNAME: '0.0.0.0'
  AUTH_TRUST_HOST: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
---
# Placeholder values. Replace before any real deployment:
#   kubectl -n atlas create secret generic atlas-secrets \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=DATABASE_URL='postgresql://atlas:STRONG@postgres:5432/atlas' \
#     --from-literal=ADMIN_EMAIL='admin@yourdomain.com' \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  namespace: atlas
type: Opaque
stringData:
  AUTH_SECRET: 'CHANGE_ME_openssl_rand_base64_32'
  DATABASE_URL: 'postgresql://atlas:CHANGE_ME@postgres:5432/atlas'
  POSTGRES_USER: 'atlas'
  POSTGRES_PASSWORD: 'CHANGE_ME'
  POSTGRES_DB: 'atlas'
  ADMIN_EMAIL: 'admin'
  ADMIN_PASSWORD: 'admin'
